groups:
  - name: checkout-slo
    rules:
      - alert: CheckoutHighErrorRate
        expr: |
          sum(rate(http_server_duration_milliseconds_count{job="checkout-service", http_status_code=~"5.."}[5m]))
            /
          sum(rate(http_server_duration_milliseconds_count{job="checkout-service"}[5m]))
            > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Checkout error rate above 5% for 2 minutes"
          runbook: "https://github.com/KeninP/sre-observability-zero-to-hero/tree/main/05-incident-response"

      - alert: CheckoutSlowP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_duration_milliseconds_bucket{job="checkout-service"}[5m]))
          ) > 500
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "Service p95 latency above 500 ms"
